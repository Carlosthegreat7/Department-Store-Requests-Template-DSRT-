{% extends "base.html" %}

{% block content %}

<div class="bg-blob blob-purple"></div>
<div class="bg-blob blob-blue"></div>

<div class="container pb-5">
    <div class="d-flex align-items-center mb-4 mt-3">
        <a href="{{ url_for('admin_management') }}" class="btn btn-light rounded-circle shadow-sm mr-3 back-btn-bento" style="width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s ease;">
            <i class="fas fa-arrow-left text-secondary" style="font-size: 1.2rem;"></i>
        </a>
        <div>
            <h2 style="font-weight: 900; letter-spacing: -1px; color: var(--dark-text); margin-bottom: 2px;">System Audit Log</h2>
            <p class="text-muted mb-0 font-weight-500">Track and review all user actions and barcode commits.</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm bento-card" style="background: var(--card-bg); backdrop-filter: blur(25px); border-radius: var(--radius-lg); overflow: hidden;">
        
        <div class="card-header bg-white border-0 py-4 px-4 d-flex justify-content-between align-items-center flex-wrap" style="border-bottom: 1px solid rgba(0,0,0,0.03) !important; gap: 15px;">
            <h5 class="font-weight-bold mb-0 d-flex align-items-center">
                <div class="icon-square-bento mr-3"><i class="fas fa-history text-secondary"></i></div>
                Activity Records
            </h5>
            
            <div class="d-flex align-items-center flex-wrap" style="gap: 15px;">
                <div class="position-relative">
                    <i class="fas fa-search position-absolute text-muted" style="left: 15px; top: 50%; transform: translateY(-50%); font-size: 0.9rem;"></i>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search logs..." style="border-radius: 20px; padding-left: 35px; border: 1px solid var(--glass-border); background: #f8f9fa; width: 220px;">
                </div>
                
                <div class="badge badge-pill badge-bento-light px-3 py-2 d-flex align-items-center" id="filterControls" style="gap: 10px;">
                    <span class="filter-badge filter-active text-dark" id="filter-all" onclick="filterByStatus('all')">
                        <i class="fas fa-list mr-1"></i> <span id="count-all">0</span> All
                    </span> <span class="text-muted opacity-50">|</span>
                    
                    <span class="text-success filter-badge" id="filter-commit" onclick="filterByStatus('commit')">
                        <i class="fas fa-database mr-1"></i> <span id="count-commit">0</span> Commits
                    </span> <span class="text-muted opacity-50">|</span>
                    
                    <span class="text-danger filter-badge" id="filter-error" onclick="filterByStatus('error')">
                        <i class="fas fa-exclamation-triangle mr-1"></i> <span id="count-error">0</span> Errors
                    </span>
                </div>
            </div>
        </div>
        
        <div class="table-responsive" style="min-height: 400px;">
            <table class="table table-bento table-hover mb-0">
                <thead style="background-color: #f8f9fa;">
                    <tr>
                        <th class="px-4" style="width: 25%;">DATE & TIME</th>
                        <th style="width: 20%;">USER</th>
                        <th>ACTION PERFORMED</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    </tbody>
            </table>
        </div>
        
        <div class="px-4 py-3 bg-white" id="paginationControls" style="border-top: 1px solid rgba(0,0,0,0.03);">
        </div>
    </div>
</div>

<script>
// --- 1. Load Data from Backend ---
let rawData = [];

async function loadAuditLog() {
    try {
        const res = await fetch('/api/barcode_audit_log');
        const json = await res.json();
        if (json.success) {
            rawData = json.data;
            filteredData = [...rawData];
            updateBadgeCounts();
            renderTable();
        }
    } catch (err) {
        console.error('Failed to load audit log:', err);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    loadAuditLog();
});

// --- 2. State Variables ---
let filteredData = [...rawData];
let currentPage = 1;
const rowsPerPage = 15;
let currentFilter = 'all';

// --- 3. Initialize App ---
document.addEventListener("DOMContentLoaded", () => {
    updateBadgeCounts();
    renderTable();
});

// --- 4. Search and Filter Logic ---
document.getElementById('searchInput').addEventListener('input', () => {
    filterByStatus(currentFilter);
});

window.filterByStatus = function(status) {
    currentFilter = status;
    
    // Step A: Apply Category Filter
    let tempData = rawData;
    if (status === 'login') {
        tempData = tempData.filter(row => row.action.toLowerCase().includes('log'));
    } else if (status === 'commit') {
        tempData = tempData.filter(row => row.action.toLowerCase().includes('commit') && !row.action.toLowerCase().includes('fail'));
    } else if (status === 'error') {
        tempData = tempData.filter(row => row.action.toLowerCase().includes('fail') || row.action.toLowerCase().includes('error'));
    }
    
    // Step B: Apply Search Text
    const term = document.getElementById('searchInput').value.toLowerCase();
    if (term) {
        tempData = tempData.filter(row => 
            (row.user && row.user.toLowerCase().includes(term)) ||
            (row.action && row.action.toLowerCase().includes(term)) ||
            (row.timestamp && row.timestamp.toLowerCase().includes(term))
        );
    }
    
    filteredData = tempData;
    currentPage = 1; 
    
    // Step C: Update UI Visuals
    document.querySelectorAll('.filter-badge').forEach(el => {
        el.classList.remove('filter-active');
        el.style.opacity = '0.6';
    });
    const activeBadge = document.getElementById('filter-' + status);
    if (activeBadge) {
        activeBadge.classList.add('filter-active');
        activeBadge.style.opacity = '1';
    }
    
    renderTable();
};

function updateBadgeCounts() {
    document.getElementById('count-all').innerText = rawData.length;
    document.getElementById('count-commit').innerText = rawData.filter(r => r.action.toLowerCase().includes('commit') && !r.action.toLowerCase().includes('fail')).length;
    document.getElementById('count-error').innerText = rawData.filter(r => r.action.toLowerCase().includes('fail') || r.action.toLowerCase().includes('error')).length;
}

// --- 5. Render Table ---
function renderTable() {
    const tbody = document.getElementById('resultsTableBody');
    tbody.innerHTML = '';

    const startIndex = (currentPage - 1) * rowsPerPage;
    const endIndex = startIndex + rowsPerPage;
    const paginatedData = filteredData.slice(startIndex, endIndex);

    if (paginatedData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-5 text-muted">
            <i class="fas fa-clipboard-list fa-3x mb-3" style="color: #dee2e6;"></i>
            <h5 style="font-weight: 600; color: #6c757d;">No Records Found</h5>
            <p class="mb-0 small">Try adjusting your search or filters.</p>
        </td></tr>`;
    }

    paginatedData.forEach(row => {
        // Color code the action text slightly based on what happened
        let actionStyle = "text-dark";
        let icon = '<i class="fas fa-info-circle text-muted mr-2"></i>';
        
        if (row.action.toLowerCase().includes('fail') || row.action.toLowerCase().includes('error')) {
            actionStyle = "text-danger font-weight-bold";
            icon = '<i class="fas fa-times-circle text-danger mr-2"></i>';
        } else if (row.action.toLowerCase().includes('commit')) {
            actionStyle = "text-success font-weight-bold";
            icon = '<i class="fas fa-check-circle text-success mr-2"></i>';
        } else if (row.action.toLowerCase().includes('log')) {
            icon = '<i class="fas fa-sign-in-alt text-info mr-2"></i>';
        }

        tbody.innerHTML += `
            <tr>
                <td class="px-4 py-3 align-middle text-muted">
                    <i class="far fa-clock mr-1"></i> ${row.timestamp}
                </td>
                <td class="py-3 align-middle">
                    <span class="badge badge-light border px-2 py-1 shadow-sm" style="font-size: 0.9rem;">
                        <i class="fas fa-user-circle mr-1 text-secondary"></i> ${row.user}
                    </span>
                </td>
                <td class="py-3 align-middle ${actionStyle}">
                    ${icon} ${row.action}
                </td>
            </tr>
        `;
    });

    renderPagination();
}

// --- 6. Render Pagination Controls ---
function renderPagination() {
    const container = document.getElementById('paginationControls');
    const totalPages = Math.ceil(filteredData.length / rowsPerPage);
    
    if (filteredData.length === 0) {
        container.innerHTML = '';
        return;
    }

    const startItem = ((currentPage - 1) * rowsPerPage) + 1;
    const endItem = Math.min(currentPage * rowsPerPage, filteredData.length);

    let html = `
        <div class="d-flex justify-content-between align-items-center w-100">
            <span class="text-muted font-weight-500 small">Showing <strong>${startItem}</strong> to <strong>${endItem}</strong> of <strong>${filteredData.length}</strong> logs</span>
            <div class="pagination-container mt-0">
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>
    `;

    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) {
        startPage = Math.max(1, endPage - 4);
    }

    if (startPage > 1) {
        html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
        if (startPage > 2) html += `<span class="mx-1 text-muted">...</span>`;
    }

    for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    }

    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span class="mx-1 text-muted">...</span>`;
        html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
    }

    html += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
}

window.changePage = function(page) {
    const totalPages = Math.ceil(filteredData.length / rowsPerPage);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderTable();
}
</script>
{% endblock %}
